version: "3.9"

# UBID Fabric — Cloud-Ready Production Infrastructure
# Connects to Neon (PostgreSQL), Upstash (Redis), and Gemini API

services:
  api:
    build: .
    container_name: ubid-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

# Optional: Add other microservices if needed
